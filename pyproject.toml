[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "A tiny terminal expense tracker"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
expense = "expense_tracker.cli:main"

[tool.setuptools]
packages = ["expense_tracker"]
